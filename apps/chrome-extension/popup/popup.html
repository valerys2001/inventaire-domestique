<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Inventaire Domestique</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        padding: 16px;
        margin: 0;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .status {
        font-size: 13px;
        margin-bottom: 12px;
        padding: 6px 8px;
        border-radius: 4px;
      }
      .status.ok {
        color: #1b5e20;
        background: #e8f5e9;
      }
      .status.ko {
        color: #b71c1c;
        background: #ffebee;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
        color: #444;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-bottom: 8px;
      }
      .last-import {
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Inventaire Domestique — Chronodrive</h1>
    <div id="status" class="status">Vérification…</div>
    <button id="connect-btn" type="button">Se connecter à Google</button>

    <label for="spreadsheet-id">ID du Google Sheet partagé</label>
    <input id="spreadsheet-id" type="text" placeholder="1AbCdEfGhIjKlmnOpQrStuVwXyZ" />
    <button id="save-btn" type="button">Enregistrer</button>

    <div id="last-import" class="last-import">Aucun import pour l'instant.</div>

    <script src="popup.js"></script>
  </body>
</html>
